# MentorPi Mailun/Ackermann Deluxe (Pi 5 + HD depth camera + voice box)
# Use with: ros2 launch companion_bringup mentorpi_deluxe.launch.py

# --- Voice (WonderEcho Pro USB box) ---
stt_node:
  ros__parameters:
    mode: whisper
    input_device: ""        # set after: arecord -l  (often plughw:2,0)
    whisper_model: base.en
    chunk_sec: 3.0

tts_node:
  ros__parameters:
    mode: auto               # auto | log | piper — never espeak unless you set it explicitly
    output_device: ""
    piper_model: ""         # auto-discovered from ~/companion/tts/ or models/piper/

# --- HD depth camera (vendor ascamera topics) ---
camera_watch_node:
  ros__parameters:
    rgb_topic: /ascamera/camera_publisher/rgb0/image
    depth_topic: /ascamera/camera_publisher/depth0/image_raw
    status_rate_hz: 1.0

# --- Navigation (real Nav2 on Pi; sim timer off) ---
nav_bridge_node:
  ros__parameters:
    simulated_travel_sec: 0.0
    use_nav_action: true
    nav_action_name: navigate_to_pose
    map_frame: map
    follow_standoff_m: 1.5
    follow_min_confidence: 0.4
    follow_rate_hz: 2.0
    patrol_places:
      - kitchen
      - bedroom
      - dock

agent_node:
  ros__parameters:
    speak_replies: true
    wait_for_nav: true
    step_delay_sec: 1.0
    llm_provider: none
    session_max_turns: 20
    react_to_vision: true
    vision_hint_cooldown_sec: 8.0
    fact_db_path: "/var/lib/companion/facts.db"
    max_stored_facts: 500

behavior_controller_node:
  ros__parameters:
    patrol_emotions:
      - neutral
      - surprise
      - happy
      - neutral
    patrol_animation_sec: 2.5

body_status_node:
  ros__parameters:
    publish_rate_hz: 1.0
