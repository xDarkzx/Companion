# USB webcam + detector overrides for desktop_dev (enable_vision:=true)

grounded_detector_node:
  ros__parameters:
    backend: owlv2
    device: auto
    depth_mode: monocular    # a webcam has no depth sensor
    score_threshold: 0.2
    watch_labels: [person, dog]
    watch_rate_hz: 1.0
    rgb_topic: /image_raw
    depth_topic: /companion/unused_depth
    camera_info_topic: /camera_info

camera_watch_node:
  ros__parameters:
    rgb_topic: /image_raw
    depth_topic: /companion/unused_depth
    status_rate_hz: 1.0

agent_node:
  ros__parameters:
    react_to_vision: true
    vision_hint_cooldown_sec: 12.0

vision_preview_node:
  ros__parameters:
    rgb_topic: /image_raw
    display_scale: 1
