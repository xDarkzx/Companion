# Vision + empathy settings (Phase 3)

detector_node:
  ros__parameters:
    model_path: ""           # e.g. yolov8n.pt on Pi
    publish_rate_hz: 1.0
    frame_width: 640
    frame_height: 480
    source_label: stub
    rgb_topic: /ascamera/camera_publisher/rgb0/image
    use_camera: true

camera_watch_node:
  ros__parameters:
    rgb_topic: /ascamera/camera_publisher/rgb0/image
    depth_topic: /ascamera/camera_publisher/depth0/image_raw
    status_rate_hz: 1.0

human_emotion_stub_node:
  ros__parameters:
    publish_rate_hz: 0.2
    default_emotion: neutral
    default_confidence: 0.5

empathy_node:
  ros__parameters:
    min_confidence: 0.35

agent_node:
  ros__parameters:
    session_max_turns: 20
    react_to_vision: false
    vision_hint_cooldown_sec: 8.0
