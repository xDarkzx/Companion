# Vision + empathy settings (Phase 3)

grounded_detector_node:
  ros__parameters:
    backend: owlv2           # owlv2 | grounding_dino | fake (tests only)
    device: auto             # auto picks cuda when available, else cpu
    depth_mode: sensor       # sensor (RGB-D camera) | monocular | none
    score_threshold: 0.2
    watch_labels: [person, dog]
    watch_rate_hz: 2.0
    rgb_topic: /ascamera/camera_publisher/rgb0/image
    depth_topic: /ascamera/camera_publisher/depth0/image_raw
    camera_info_topic: /ascamera/camera_publisher/rgb0/camera_info

camera_watch_node:
  ros__parameters:
    rgb_topic: /ascamera/camera_publisher/rgb0/image
    depth_topic: /ascamera/camera_publisher/depth0/image_raw
    status_rate_hz: 1.0

human_emotion_stub_node:
  ros__parameters:
    publish_rate_hz: 0.2
    default_emotion: neutral
    default_confidence: 0.5

empathy_node:
  ros__parameters:
    min_confidence: 0.35

agent_node:
  ros__parameters:
    session_max_turns: 20
    react_to_vision: false
    vision_hint_cooldown_sec: 8.0
