name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ros:
    name: ROS 2 gate (build, lint, unit, integration, architecture)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install package dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --break-system-packages -r requirements-dev.txt
      - name: Quality gate
        run: bash scripts/verify_all.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colcon-test-results
          path: |
            ros2_ws/build/*/test_results/
            ros2_ws/log/latest_test/
          if-no-files-found: ignore

  vision:
    name: Vision library (Python 3.12, CPU, no model downloads)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the library and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ros2_ws/src/companion_vision pytest
      - name: Unit tests
        run: python -m pytest ros2_ws/src/companion_vision/test -q --ignore-glob='*flake8*' --ignore-glob='*pep257*'

  security:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan of the full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --verbose .
