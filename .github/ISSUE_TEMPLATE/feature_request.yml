name: Feature request
description: Propose a new behaviour, node or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the robot cannot do today, and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: New topics, services or parameters it would need, if you know them.
