name: Bug report
description: A node misbehaves, a launch fails, or a result looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The launch command, the node logs, and the message or output you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it ran
      options: [Docker gate, Desktop (WSL2 or Linux), Raspberry Pi 5]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
